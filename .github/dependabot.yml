version: 2

updates:
  # Python backend
  - package-ecosystem: pip
    directory: /
    target-branch: develop

    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome

    cooldown:
      default-days: 14
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7

    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Root tooling: Commitlint
  - package-ecosystem: npm
    directory: /
    target-branch: develop

    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome

    cooldown:
      default-days: 14
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7

    groups:
      root-npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Vue frontend
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop

    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome

    cooldown:
      default-days: 14
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7

    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # VitePress documentation
  - package-ecosystem: npm
    directory: /docs
    target-branch: develop

    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome

    cooldown:
      default-days: 14
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7

    groups:
      docs-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop

    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome

    cooldown:
      default-days: 14
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7

    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Docker base images
  - package-ecosystem: docker
    directory: /
    target-branch: develop

    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome

    cooldown:
      default-days: 14
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7

    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch